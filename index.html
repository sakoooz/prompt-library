<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" type="image/png">
<title>PROMPT LIBRARY</title>
<style>
:root{
  --accent:#6b5ce7;
  --accent-soft:#eeeaff;
  --bg:#f4f4f6;
  --card:#ffffff;
  --text:#16161a;
  --muted:#77777f;
  --line:#e7e7eb;
  --shadow:0 8px 24px rgba(30,30,40,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:28px 24px 100px}
.topbar{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.logo{
  width:58px;height:58px;border:2px solid var(--accent);border-radius:18px;
  display:grid;place-items:center;color:var(--accent);font-size:27px;background:white;
}
h1{font-size:27px;margin:0;font-weight:750;letter-spacing:.04em}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.search{
  background:white;border:1px solid var(--line);border-radius:18px;
  padding:14px 18px;font-size:17px;outline:none;width:100%;
  box-shadow:var(--shadow);
}
.search:focus{border-color:var(--accent)}
.tabs{display:flex;gap:10px;overflow:auto;padding:20px 0 12px}
.tab{
  flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;
  background:white;color:#666;display:flex;align-items:center;gap:8px;
}
.tab.active{background:var(--accent);color:white}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px}
.count{font-size:13px;color:var(--muted)}
.primary{
  border:0;border-radius:13px;padding:11px 16px;background:var(--accent);color:white;font-weight:700;
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px;box-shadow:var(--shadow);position:relative;
}
.card-top{display:flex;justify-content:space-between;gap:12px}
.card h2{font-size:17px;margin:0 0 7px}
.type{font-size:12px;color:var(--muted)}
.prompt{
  margin:15px 0;padding:14px;background:#f7f7f9;border-radius:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  line-height:1.65;max-height:105px;overflow:hidden;white-space:pre-wrap;
}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:7px}
.actions{display:flex;gap:7px}
.iconbtn{
  border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px;color:#666;
}
.copy{background:var(--accent);border-color:var(--accent);color:white;font-weight:650}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.builder{
  margin-top:30px;background:white;border:1px solid var(--line);border-radius:22px;
  padding:22px;box-shadow:var(--shadow)
}
.builder h2{margin:0 0 17px;font-size:19px}
.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field select,.field textarea,.field input{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafafa;outline:none
}
.field textarea{min-height:70px;resize:vertical}
.final textarea{min-height:100px}
.negative{
  margin-top:14px;padding:15px;background:#fafafa;border:1px solid var(--line);border-radius:13px
}
.checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}
.checks label{font-size:12px;background:white;border:1px solid var(--line);padding:8px 10px;border-radius:9px}
.final{margin-top:14px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:10
}
.modal.show{display:flex}
.dialog{background:white;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:23px}
.dialog h2{margin-top:0}
.form{display:grid;gap:13px}
.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px}
.form textarea{min-height:150px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.category-row{
  display:grid;grid-template-columns:1fr 54px auto auto;gap:8px;align-items:center;
  padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafafa
}
.category-row input[type="text"]{min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px}
.category-row input[type="color"]{
  width:48px;height:38px;padding:3px;border:1px solid var(--line);border-radius:9px;background:white
}
.smallbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px}
.cat-delete{
  border:0;color:#fff;width:34px;height:40px;font-size:18px;padding:0 10px 0 2px;
}
@media(max-width:700px){
  .category-row{grid-template-columns:1fr 48px;gap:7px}
  .category-row .smallbtn{grid-column:auto}
}
.secondary{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 14px}
.toolbar-btn{border:1px solid var(--line); background:white; border-radius:9px; padding:8px 11px; font-size:12px; color:#555; white-space:nowrap;}
@media(max-width:700px){
  .toolbar{align-items:flex-start;gap:10px}
  .toolbar > div:last-child{width:100%}
  .toolbar > div:last-child button{flex:1}
  .app{padding:20px 14px 100px}
  .grid,.builder-grid{grid-template-columns:1fr}
  .topbar{gap:12px}
  .logo{width:50px;height:50px;border-radius:16px}
  h1{font-size:22px}
  .card{border-radius:18px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">✦</div>
    <div><h1>PROMPT LIBRARY</h1><div class="sub">Image Generation Prompt Manager</div></div>
  </header>

  <input id="search" class="search" placeholder="⌕  プロンプトを検索">

  <nav id="tabs" class="tabs"></nav>

  <div class="toolbar">
    <div id="count" class="count"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <button class="toolbar-btn" onclick="openCategoryManager()">⚙ カテゴリ管理</button>
      <button class="toolbar-btn" onclick="exportJSON()">↓ JSON出力</button>
      <button class="toolbar-btn" onclick="document.getElementById('importFile').click()">↑ JSON読込</button>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
      <button class="primary" onclick="openPromptModal()">＋ プロンプト追加</button>
    </div>
  </div>

  <main id="cards" class="grid"></main>

  <section class="builder">
    <h2>✦ PROMPT BUILDER</h2>

    <div class="builder-grid">
      <div class="field">
        <label>CHARACTER</label>
        <select id="bChar">
          <option>1boy, ((male solo))</option>
          <option>1girl, ((female solo))</option>
          <option>character base</option>
        </select>
      </div>

      <div class="field">
        <label>BASE</label>
        <select id="bBase"></select>
      </div>

      <div class="field">
        <label>FACE</label>
        <input id="bFace" placeholder="black eyes, sharp nose">
      </div>

      <div class="field">
        <label>POSE / EXPRESSION</label>
        <input id="bPose" placeholder="arms crossed, serious expression">
      </div>
    </div>

    <div class="negative">
      <strong>NEGATIVE BUILDER</strong>
      <div style="font-size:12px;color:#777;margin-top:4px">
        基本セットから、必要なものだけ選択
      </div>
      <div id="negativeChecks" class="checks">
        <label><input type="checkbox" value="bad hands, malformed hands, extra fingers, missing fingers" checked> 手・指</label>
        <label><input type="checkbox" value="bad anatomy, deformed body, malformed limbs" checked> 人体</label>
        <label><input type="checkbox" value="bad face, deformed face, asymmetrical eyes"> 顔</label>
        <label><input type="checkbox" value="blurry background, distorted background"> 背景</label>
        <label><input type="checkbox" value="low quality, worst quality, lowres"> 低品質</label>
        <label><input type="checkbox" value="text, logo, signature, watermark, letters, words, typography"> 文字</label>
      </div>
    </div>

    <div class="field final">
      <label>FINAL PROMPT</label>
      <textarea id="finalPrompt" placeholder="ここにPositiveプロンプトを自由に貼り付け・編集できます。"></textarea>
    </div>

    <div class="field final">
      <label>FINAL NEGATIVE</label>
      <textarea id="finalNegative" placeholder="ここにNegativeプロンプトを自由に貼り付け・編集できます。"></textarea>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="primary" onclick="copyPositive()">📋 Positiveをコピー</button>
      <button class="primary" onclick="copyNegative()">📋 Negativeをコピー</button>
    </div>
  </section>
</div>

<div id="categoryModal" class="modal">
  <div class="dialog">
    <h2>カテゴリ管理</h2>
    <div id="categoryList" style="display:grid;gap:10px"></div>
    <div class="dialog-actions">
      <button class="secondary" onclick="closeCategoryManager()">閉じる</button>
      <button class="primary" onclick="addCategory();renderCategoryManager()">＋ カテゴリ追加</button>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="dialog">
    <h2 id="modalTitle">プロンプトを追加</h2>
    <div class="form">
      <input id="pTitle" placeholder="タイトル">
      <select id="pCategory"></select>
      <select id="pType"><option value="positive">ポジティブ</option><option value="negative">ネガティブ</option></select>
      <textarea id="pText" placeholder="プロンプト本文"></textarea>
      <input id="pTags" placeholder="タグ（カンマ区切り）">
    </div>
    <div class="dialog-actions">
      <button class="secondary" onclick="closeModal()">キャンセル</button>
      <button class="primary" onclick="savePrompt()">保存</button>
    </div>
  </div>
</div>

<script>
const KEY="prompt-library-v1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  categories:[
    {name:"ヘアスタイル",color:"#a98a64"},
    {name:"ネガティブ",color:"#5f55dd"},
    {name:"衣装",color:"#4caf6d"},
    {name:"ポーズ",color:"#e26c8c"}
  ],
  prompts:[
    {title:"襟足を短くするポジティブ",category:"ヘアスタイル",type:"positive",text:"high skin fade, fade on back, back of head shaved, shaved nape, clean nape, tight fade",tags:["短髪","フェード"]},
    {title:"襟足短い無造作ミディアム",category:"ヘアスタイル",type:"positive",text:"messy textured medium-length hair, medium-length top, short tapered nape, clean nape",tags:["ミディアム","無造作"]},
    {title:"左右対称オールバック",category:"ヘアスタイル",type:"positive",text:"symmetrical hairstyle, both sides slicked back, curtain bangs, straight center bangs",tags:["オールバック","ネガティブ"]},
    {title:"右側だけオールバック",category:"ヘアスタイル",type:"positive",text:"asymmetrical hairstyle, one side slicked back hair, viewer left side slicked back, viewer right side natural",tags:["オールバック"]},
    {title:"代理ヘアスタイル・ネガティブ",category:"ヘアスタイル",type:"negative",text:"inner color hair, dyed hair ends, colored tips, two-tone hair, split color hair, gradient hair",tags:["髪色","ネガティブ"]}
  ]
};
let active="ALL", editIndex=null;

function saveData(){localStorage.setItem(KEY,JSON.stringify(data));}
function renderTabs(){
  tabs.innerHTML="";
  addTab("ALL","すべて",null);
  data.categories.forEach(c=>addTab(c.name,c.name,c.color));
  addTab("__NEW__","＋ カテゴリ追加",null);
}
function addTab(key,label,color){
  const wrap=document.createElement("div");
  wrap.style.cssText="display:flex;align-items:center;flex:0 0 auto;border-radius:999px;overflow:hidden;";
  if(key==="__NEW__"){
    const b=document.createElement("button");
    b.className="tab";
    b.onclick=addCategory;
    b.innerHTML=label;
    wrap.appendChild(b);
    tabs.appendChild(wrap);
    return;
  }
  const b=document.createElement("button");
  b.className="tab"+(active===key?" active":"");
  b.style.background=color || "var(--accent)";
  b.style.color="#fff";
  b.onclick=()=>{active=key;render();};
  b.innerHTML=esc(label);
  wrap.appendChild(b);
  tabs.appendChild(wrap);
}

function render(){
  renderTabs();
  const q=search.value.trim().toLowerCase();
  const arr=data.prompts.filter(p=>(active==="ALL"||p.category===active) &&
    (!q || [p.title,p.text,p.category,...p.tags].join(" ").toLowerCase().includes(q)));
  count.textContent=`${arr.length} 件`;
  cards.innerHTML="";
  if(!arr.length){cards.innerHTML='<div class="empty" style="grid-column:1/-1">該当するプロンプトがありません。</div>';return;}
  arr.forEach((p)=> {
    const real=data.prompts.indexOf(p);
    const cat=data.categories.find(c=>c.name===p.category);
    cards.innerHTML+=`
      <article class="card">
        <div class="card-top"><div><h2>${esc(p.title)}</h2><div class="type">${p.type==="negative"?"ネガティブ":"ポジティブ"}</div></div><button class="iconbtn" onclick="deletePrompt(${real})">×</button></div>
        <div class="prompt">${esc(p.text)}</div>
        <div class="meta">
          <div class="tags"><span class="tag" style="color:${cat?.color||'var(--accent)'}">${esc(p.category)}</span>${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
          <div class="actions"><button class="iconbtn" onclick="editPrompt(${real})">編集</button><button class="iconbtn copy" onclick="copyText(${real})">コピー</button></div>
        </div>
      </article>`;
  });
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function addCategory(){
  const name=prompt("新しいカテゴリ名を入力してください");
  if(!name)return;
  if(data.categories.some(c=>c.name===name)){alert("そのカテゴリは既にあります。");return;}
  const color=prompt("アクセントカラーを入力（例：#ff6688）","#6b5ce7")||"#6b5ce7";
  if(!/^#[0-9a-fA-F]{6}$/.test(color)){alert("カラーは #RRGGBB 形式で入力してください。");return;}
  data.categories.push({name,color});
  saveData();active=name;render();updateCategoryOptions();updateBuilderOptions();
}
function openCategoryManager(){
  renderCategoryManager();
  categoryModal.classList.add("show");
}
function closeCategoryManager(){categoryModal.classList.remove("show");}
function renderCategoryManager(){
  categoryList.innerHTML="";
  data.categories.forEach((c,i)=>{
    const row=document.createElement("div");
    row.className="category-row";
    row.innerHTML=`
  <input type="text" value="${esc(c.name)}" aria-label="カテゴリ名">
  <input type="color" value="${esc(c.color || "#6b5ce7")}" aria-label="カテゴリカラー">
  <button class="smallbtn" onclick="moveCategory(${i},-1)">↑</button>
  <button class="smallbtn" onclick="moveCategory(${i},1)">↓</button>
  <button class="smallbtn" onclick="saveCategoryEdit(${i},this)">保存</button>
  <button class="smallbtn" onclick="deleteCategoryAt(${i})">削除</button>
`;
    categoryList.appendChild(row);
  });
}
function moveCategory(index,direction){
  const newIndex=index+direction;

  if(newIndex<0 || newIndex>=data.categories.length){
    return;
  }

  const temp=data.categories[index];
  data.categories[index]=data.categories[newIndex];
  data.categories[newIndex]=temp;

  saveData();
  render();
  renderCategoryManager();
}

function saveCategoryEdit(i,button){
  const row=button.parentElement;
  const nameInput=row.querySelector('input[type="text"]');
  const colorInput=row.querySelector('input[type="color"]');
  const oldName=data.categories[i].name;
  const newName=nameInput.value.trim();
  const newColor=colorInput.value;
  if(!newName){alert("カテゴリ名を入力してください。");return;}
  if(data.categories.some((c,idx)=>idx!==i && c.name===newName)){
    alert("そのカテゴリ名は既にあります。");return;
  }
  data.categories[i].name=newName;
  data.categories[i].color=newColor;
  data.prompts.forEach(p=>{if(p.category===oldName)p.category=newName;});
  if(active===oldName)active=newName;
  saveData();updateCategoryOptions();render();renderCategoryManager();updateBuilderOptions();
}
function deleteCategoryAt(i){
  deleteCategory(data.categories[i].name);
  renderCategoryManager();
}
function exportJSON(){
  const payload={
    format:"PROMPT_LIBRARY",
    version:1,
    exportedAt:new Date().toISOString(),
    categories:data.categories,
    prompts:data.prompts
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="prompt-library-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importJSON(event){
  const file=event.target.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      if(!Array.isArray(incoming.categories)||!Array.isArray(incoming.prompts)) throw new Error("invalid");
      if(!confirm("現在のライブラリをJSONの内容で置き換えます。よろしいですか？")) return;
      data={
        categories:incoming.categories.map(c=>({
          name:String(c.name||"カテゴリ"),
          color:/^#[0-9a-fA-F]{6}$/.test(String(c.color))?String(c.color):"#6b5ce7"
        })),
        prompts:incoming.prompts.map(p=>({
          title:String(p.title||"無題"),
          category:String(p.category||""),
          type:p.type==="negative"?"negative":"positive",
          text:String(p.text||""),
          tags:Array.isArray(p.tags)?p.tags.map(String):[]
        }))
      };
      if(data.categories.length){
        const fallback=data.categories[0].name;
        data.prompts.forEach(p=>{
          if(!data.categories.some(c=>c.name===p.category))p.category=fallback;
        });
      }
      active="ALL";
      saveData();updateCategoryOptions();render();updateBuilderOptions();
      alert("JSONを読み込みました。");
    }catch(e){
      alert("JSONの形式を読み込めませんでした。");
    }finally{
      event.target.value="";
    }
  };
  reader.readAsText(file);
}

function updateCategoryOptions(){
  pCategory.innerHTML=data.categories.map(c=>`<option>${esc(c.name)}</option>`).join("");
}
function deleteCategory(name){
  const used=data.prompts.some(p=>p.category===name);
  if(used){
    alert("このカテゴリにはプロンプトが登録されています。\n先に別のカテゴリへ移動してから削除してください。");
    return;
  }
  if(!confirm(`「${name}」カテゴリを削除しますか？`)) return;
  data.categories=data.categories.filter(c=>c.name!==name);
  if(active===name) active="ALL";
  saveData(); updateCategoryOptions(); render(); updateBuilderOptions();
}
function openPromptModal(index=null){
  editIndex=index;
  modalTitle.textContent=index===null?"プロンプトを追加":"プロンプトを編集";
  if(index===null){pTitle.value="";pText.value="";pTags.value="";pType.value="positive";pCategory.value=data.categories[0]?.name||"";}
  else{
    const p=data.prompts[index];pTitle.value=p.title;pText.value=p.text;pTags.value=p.tags.join(",");pType.value=p.type;pCategory.value=p.category;
  }
  modal.classList.add("show");
}
function closeModal(){modal.classList.remove("show");editIndex=null;}
function savePrompt(){
  const p={title:pTitle.value.trim()||"無題",category:pCategory.value,type:pType.value,text:pText.value.trim(),tags:pTags.value.split(",").map(x=>x.trim()).filter(Boolean)};
  if(editIndex===null)data.prompts.unshift(p);else data.prompts[editIndex]=p;
  saveData();closeModal();render();updateBuilderOptions();
}
function editPrompt(i){openPromptModal(i)}
function deletePrompt(i){if(confirm("このプロンプトを削除しますか？")){data.prompts.splice(i,1);saveData();render();updateBuilderOptions();}}
async function copyText(i){await navigator.clipboard.writeText(data.prompts[i].text);alert("コピーしました。");}
let finalPromptManual=false;
let finalNegativeManual=false;
let lastBuilderPositive="";
let lastBuilderNegative="";

function updateBuilderOptions(){
  const baseSelect=document.getElementById("bBase");

  const basePrompts=data.prompts.filter(p=>
    p.type==="positive" && p.category==="ベース"
  );

  const currentBase=baseSelect.value;
  baseSelect.innerHTML="";

  if(basePrompts.length){
    basePrompts.forEach(p=>{
      const option=document.createElement("option");
      option.value=p.text;
      option.textContent=p.text;
      baseSelect.appendChild(option);
    });
    if(basePrompts.some(p=>p.text===currentBase)){
      baseSelect.value=currentBase;
    }
  }else{
    const option=document.createElement("option");
    option.value="";
    option.textContent="（登録されたBASEなし）";
    baseSelect.appendChild(option);
  }

  syncBuilderToFinal(true);
}

function getBuilderPositive(){
  return [bChar.value,bBase.value,bFace.value,bPose.value]
    .map(x=>x.trim())
    .filter(Boolean)
    .join(", ");
}

function getBuilderNegative(){
  return [...document.querySelectorAll("#negativeChecks input:checked")]
    .map(x=>x.value.trim())
    .filter(Boolean)
    .join(", ");
}

function syncBuilderToFinal(force=false){
  const positive=getBuilderPositive();
  const negative=getBuilderNegative();

  if(force || !finalPromptManual || finalPrompt.value.trim()==="" || finalPrompt.value===lastBuilderPositive){
    finalPrompt.value=positive;
    finalPromptManual=false;
  }

  if(force || !finalNegativeManual || finalNegative.value.trim()==="" || finalNegative.value===lastBuilderNegative){
    finalNegative.value=negative;
    finalNegativeManual=false;
  }

  lastBuilderPositive=positive;
  lastBuilderNegative=negative;
}

function markFinalPromptManual(){
  if(finalPrompt.value!==lastBuilderPositive) finalPromptManual=true;
}

function markFinalNegativeManual(){
  if(finalNegative.value!==lastBuilderNegative) finalNegativeManual=true;
}

async function copyPositive(){
  await navigator.clipboard.writeText(finalPrompt.value);
  alert("Positiveプロンプトをコピーしました。");
}

async function copyNegative(){
  await navigator.clipboard.writeText(finalNegative.value);
  alert("Negativeプロンプトをコピーしました。");
}

search.addEventListener("input",render);

document.querySelectorAll(".builder input,.builder select").forEach(x=>{
  x.addEventListener("input",()=>syncBuilderToFinal(false));
  x.addEventListener("change",()=>syncBuilderToFinal(false));
});

finalPrompt.addEventListener("input",markFinalPromptManual);
finalNegative.addEventListener("input",markFinalNegativeManual);

updateCategoryOptions();
render();
updateBuilderOptions();
</script>
</body>
</html>
